name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: generated annotations are fresh
        run: |
          moon run src/cmd/rpc --target native -- -C . src/examples/21-annotations/greeter.mbt -o src/examples/21-annotations/greeter.g.mbt --check
          moon run src/cmd/rpc --target native -- -C . src/cmd/greetd/greet.mbt -o src/cmd/greetd/greet.g.mbt --check

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # Real third-party gRPC interop: a genuine `grpcurl` client (Go, unrelated codebase)
  # discovers the moonrpc server via Server Reflection and calls it. This proves the
  # self-built HTTP/2 + HPACK + gRPC framing + trailers + descriptor bytes actually
  # interoperate with a foreign, unforgiving client — not just moonrpc talking to
  # itself. A transport regression makes the grep assertions fail.
  grpcurl-interop:
    name: real gRPC interop (grpcurl)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: build the greeter server
        run: moon build --target native

      - name: grpcurl list / describe / call against the moonrpc server
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          # `moon run` launches the (already-built) native greeter in the background;
          # the job teardown reaps it.
          moon run src/cmd/greetd --target native -- 12000 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          # Wait for the server to accept connections rather than guessing a sleep.
          for i in $(seq 1 30); do
            if grpcurl -plaintext -max-time 2 127.0.0.1:12000 list >/dev/null 2>&1; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          echo "== list (Server Reflection) =="
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 list | tee /tmp/list.txt
          grep -q '^greet.Greeter$' /tmp/list.txt
          echo "== describe =="
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.Greeter | tee /tmp/desc.txt
          grep -q 'rpc SayHello' /tmp/desc.txt
          grep -q 'rpc Echo ( stream .greet.Number ) returns ( stream .greet.Number )' /tmp/desc.txt
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.Mood | tee /tmp/enum.txt
          grep -q 'MOOD_GLAD = 1' /tmp/enum.txt
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.HelloRequest | tee /tmp/msg.txt
          grep -q 'map<string, int64> extras = 3' /tmp/msg.txt
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.Greeter.SayHello
          echo "== unary call with an enum and a map (OK) =="
          grpcurl -plaintext -max-time 10 -d '{"name":"world","mood":"MOOD_GLAD","extras":{"a":"2","b":"40"}}' 127.0.0.1:12000 greet.Greeter/SayHello | tee /tmp/call.txt
          grep -q 'Hello, world' /tmp/call.txt
          grep -q '"mood": "MOOD_GLAD"' /tmp/call.txt
          grep -q '"total": "42"' /tmp/call.txt
          echo "== streams =="
          grpcurl -plaintext -max-time 10 -d '{"n":3}' 127.0.0.1:12000 greet.Greeter/CountTo | tee /tmp/up.txt
          test "$(grep -c '"value"' /tmp/up.txt)" = 3
          grpcurl -plaintext -max-time 10 -d '{"value":1} {"value":41}' 127.0.0.1:12000 greet.Greeter/Sum | tee /tmp/sum.txt
          grep -q '"value": 42' /tmp/sum.txt
          grpcurl -plaintext -max-time 10 -d '{"value":1} {"value":2}' 127.0.0.1:12000 greet.Greeter/Echo | tr -d ' \n' | tee /tmp/echo.txt
          grep -q '{"value":2}{"value":1}' /tmp/echo.txt
          echo "== the generated client against the same server =="
          # The built binary, not `moon run`, which would wait on the build lock the
          # running server holds.
          ./_build/native/debug/build/cmd/greetd/greetd.exe check 12000 | tee /tmp/check.txt
          grep -q 'client and channel agree' /tmp/check.txt
          echo "== unary call (non-OK status) =="
          # An empty name must come back as INVALID_ARGUMENT with its message; grpcurl
          # exits non-zero, so capture rather than let `set -e` abort.
          set +e
          grpcurl -plaintext -max-time 10 -d '{"name":""}' 127.0.0.1:12000 greet.Greeter/SayHello 2>/tmp/err.txt
          set -e
          cat /tmp/err.txt
          grep -q 'InvalidArgument' /tmp/err.txt
          grep -q 'name is required' /tmp/err.txt
          echo "grpcurl interop OK"

  # The same server over TLS: a CA-signed certificate, ALPN `h2`, and a real grpcurl
  # and the generated client both verifying the chain against the CA. A server that
  # negotiated no ALPN, or the wrong one, fails the greetd start-up handshake here.
  tls-interop:
    name: real gRPC interop over TLS (grpcurl)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: build the greeter server
        run: moon build --target native

      - name: a CA and a certificate for it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tls"
          cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout ca-key.pem -out ca.pem -days 2 -nodes -subj "/CN=moonrpc test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out server.csr -nodes -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
            -out cert.pem -days 2 -extfile ext.cnf

      - name: grpcurl and the generated client over TLS
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          TLS="$RUNNER_TEMP/tls"
          ./_build/native/debug/build/cmd/greetd/greetd.exe 12001 "$TLS/cert.pem" "$TLS/key.pem" &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if grpcurl -cacert "$TLS/ca.pem" -max-time 2 127.0.0.1:12001 list >/dev/null 2>&1; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          echo "== list over TLS =="
          grpcurl -cacert "$TLS/ca.pem" -max-time 10 127.0.0.1:12001 list | tee /tmp/tls-list.txt
          grep -q '^greet.Greeter$' /tmp/tls-list.txt
          echo "== unary call over TLS =="
          grpcurl -cacert "$TLS/ca.pem" -max-time 10 \
            -d '{"name":"world","mood":"MOOD_GLAD","extras":{"a":"2","b":"40"}}' \
            127.0.0.1:12001 greet.Greeter/SayHello | tee /tmp/tls-call.txt
          grep -q 'Hello, world' /tmp/tls-call.txt
          grep -q '"total": "42"' /tmp/tls-call.txt
          echo "== server streaming over TLS =="
          grpcurl -cacert "$TLS/ca.pem" -max-time 10 -d '{"n":3}' \
            127.0.0.1:12001 greet.Greeter/CountTo | tee /tmp/tls-up.txt
          test "$(grep -c '"value"' /tmp/tls-up.txt)" = 3
          echo "== the generated client over TLS =="
          ./_build/native/debug/build/cmd/greetd/greetd.exe check 12001 "$TLS/ca.pem" | tee /tmp/tls-check.txt
          grep -q 'client and channel agree' /tmp/tls-check.txt
          echo "== a client that does not offer h2 is refused =="
          set +e
          printf 'GET / HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n' | \
            timeout 5 openssl s_client -connect 127.0.0.1:12001 -alpn http/1.1 \
              -CAfile "$TLS/ca.pem" 2>&1 | tee /tmp/tls-alpn.txt
          set -e
          grep -q 'no application protocol\|alert' /tmp/tls-alpn.txt
          echo "TLS interop OK"
