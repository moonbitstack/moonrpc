name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: generated annotations are fresh
        run: |
          moon run src/cmd/rpc --target native -- -C . src/examples/21-annotations/greeter.mbt -o src/examples/21-annotations/greeter.g.mbt --check
          moon run src/cmd/rpc --target native -- -C . src/cmd/greetd/greet.mbt -o src/cmd/greetd/greet.g.mbt --check
          moon run src/cmd/thriftc --target native -- -C . src/examples/29-thrift-idl/greet.thrift -o src/examples/29-thrift-idl/greet.g.mbt --check

      - name: the guide is generated from its runnable packages
        if: runner.os == 'Linux'
        run: python3 scripts/gen_guide.py --check

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      # The `.proto` files are the source; the MoonBit module next to them is generated from
      # them, because MoonBit cannot embed a file at build time.
      - name: the generated IDL is up to date
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_conformance_idl.py
          moon fmt
          git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # Real third-party gRPC interop: a genuine `grpcurl` client (Go, unrelated codebase)
  # discovers the moonrpc server via Server Reflection and calls it. This proves the
  # self-built HTTP/2 + HPACK + gRPC framing + trailers + descriptor bytes actually
  # interoperate with a foreign, unforgiving client — not just moonrpc talking to
  # itself. A transport regression makes the grep assertions fail.
  grpcurl-interop:
    name: real gRPC interop (grpcurl)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: build the greeter server
        run: moon build --target native

      - name: grpcurl list / describe / call against the moonrpc server
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          # `moon run` launches the (already-built) native greeter in the background;
          # the job teardown reaps it.
          moon run src/cmd/greetd --target native -- 12000 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          # Wait for the server to accept connections rather than guessing a sleep.
          for i in $(seq 1 30); do
            if grpcurl -plaintext -max-time 2 127.0.0.1:12000 list >/dev/null 2>&1; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          echo "== list (Server Reflection) =="
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 list | tee /tmp/list.txt
          grep -q '^greet.Greeter$' /tmp/list.txt
          echo "== describe =="
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.Greeter | tee /tmp/desc.txt
          grep -q 'rpc SayHello' /tmp/desc.txt
          grep -q 'rpc Echo ( stream .greet.Number ) returns ( stream .greet.Number )' /tmp/desc.txt
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.Mood | tee /tmp/enum.txt
          grep -q 'MOOD_GLAD = 1' /tmp/enum.txt
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.HelloRequest | tee /tmp/msg.txt
          grep -q 'map<string, int64> extras = 3' /tmp/msg.txt
          grpcurl -plaintext -max-time 10 127.0.0.1:12000 describe greet.Greeter.SayHello
          echo "== unary call with an enum and a map (OK) =="
          grpcurl -plaintext -max-time 10 -d '{"name":"world","mood":"MOOD_GLAD","extras":{"a":"2","b":"40"}}' 127.0.0.1:12000 greet.Greeter/SayHello | tee /tmp/call.txt
          grep -q 'Hello, world' /tmp/call.txt
          grep -q '"mood": "MOOD_GLAD"' /tmp/call.txt
          grep -q '"total": "42"' /tmp/call.txt
          echo "== streams =="
          grpcurl -plaintext -max-time 10 -d '{"n":3}' 127.0.0.1:12000 greet.Greeter/CountTo | tee /tmp/up.txt
          test "$(grep -c '"value"' /tmp/up.txt)" = 3
          grpcurl -plaintext -max-time 10 -d '{"value":1} {"value":41}' 127.0.0.1:12000 greet.Greeter/Sum | tee /tmp/sum.txt
          grep -q '"value": 42' /tmp/sum.txt
          grpcurl -plaintext -max-time 10 -d '{"value":1} {"value":2}' 127.0.0.1:12000 greet.Greeter/Echo | tr -d ' \n' | tee /tmp/echo.txt
          grep -q '{"value":2}{"value":1}' /tmp/echo.txt
          echo "== a compressed reply, to a client that says it accepts gzip =="
          # The server compresses when the caller lists gzip; grpc-go — which grpcurl is —
          # registers the gzip codec, so it decodes the reply as usual.
          grpcurl -plaintext -max-time 10 \
            -H 'grpc-accept-encoding: gzip' \
            -d '{"name":"world","mood":"MOOD_GLAD","extras":{"a":"2","b":"40"}}' \
            127.0.0.1:12000 greet.Greeter/SayHello | tee /tmp/gzip.txt
          grep -q 'Hello, world' /tmp/gzip.txt
          grep -q '"total": "42"' /tmp/gzip.txt
          echo "== the generated client against the same server =="
          # The built binary, not `moon run`, which would wait on the build lock the
          # running server holds.
          ./_build/native/debug/build/cmd/greetd/greetd.exe check 12000 | tee /tmp/check.txt
          grep -q 'client and channel agree' /tmp/check.txt
          echo "== unary call (non-OK status) =="
          # An empty name must come back as INVALID_ARGUMENT with its message; grpcurl
          # exits non-zero, so capture rather than let `set -e` abort.
          set +e
          grpcurl -plaintext -max-time 10 -d '{"name":""}' 127.0.0.1:12000 greet.Greeter/SayHello 2>/tmp/err.txt
          set -e
          cat /tmp/err.txt
          grep -q 'InvalidArgument' /tmp/err.txt
          grep -q 'name is required' /tmp/err.txt
          echo "grpcurl interop OK"

  # The same server over TLS: a CA-signed certificate, ALPN `h2`, and a real grpcurl
  # and the generated client both verifying the chain against the CA. A server that
  # negotiated no ALPN, or the wrong one, fails the greetd start-up handshake here.
  tls-interop:
    name: real gRPC interop over TLS (grpcurl)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: build the greeter server
        run: moon build --target native

      - name: a CA and a certificate for it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tls"
          cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout ca-key.pem -out ca.pem -days 2 -nodes -subj "/CN=moonrpc test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out server.csr -nodes -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
            -out cert.pem -days 2 -extfile ext.cnf

      - name: grpcurl and the generated client over TLS
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          TLS="$RUNNER_TEMP/tls"
          ./_build/native/debug/build/cmd/greetd/greetd.exe 12001 "$TLS/cert.pem" "$TLS/key.pem" &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if grpcurl -cacert "$TLS/ca.pem" -max-time 2 127.0.0.1:12001 list >/dev/null 2>&1; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          echo "== list over TLS =="
          grpcurl -cacert "$TLS/ca.pem" -max-time 10 127.0.0.1:12001 list | tee /tmp/tls-list.txt
          grep -q '^greet.Greeter$' /tmp/tls-list.txt
          echo "== unary call over TLS =="
          grpcurl -cacert "$TLS/ca.pem" -max-time 10 \
            -d '{"name":"world","mood":"MOOD_GLAD","extras":{"a":"2","b":"40"}}' \
            127.0.0.1:12001 greet.Greeter/SayHello | tee /tmp/tls-call.txt
          grep -q 'Hello, world' /tmp/tls-call.txt
          grep -q '"total": "42"' /tmp/tls-call.txt
          echo "== server streaming over TLS =="
          grpcurl -cacert "$TLS/ca.pem" -max-time 10 -d '{"n":3}' \
            127.0.0.1:12001 greet.Greeter/CountTo | tee /tmp/tls-up.txt
          test "$(grep -c '"value"' /tmp/tls-up.txt)" = 3
          echo "== the generated client over TLS =="
          ./_build/native/debug/build/cmd/greetd/greetd.exe check 12001 "$TLS/ca.pem" | tee /tmp/tls-check.txt
          grep -q 'client and channel agree' /tmp/tls-check.txt
          echo "== a client that does not offer h2 is refused =="
          set +e
          printf 'GET / HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n' | \
            timeout 5 openssl s_client -connect 127.0.0.1:12001 -alpn http/1.1 \
              -CAfile "$TLS/ca.pem" 2>&1 | tee /tmp/tls-alpn.txt
          set -e
          grep -q 'no application protocol\|alert' /tmp/tls-alpn.txt
          echo "TLS interop OK"

  # A genuine grpc-go client calling the moonrpc server: all four cardinalities, an
  # interceptor chain, gzip, and plaintext and TLS. grpcurl already proves the wire; this
  # proves the same wire to a hand-written Go program using the full call API — including the
  # parts of a call that are not a message: metadata the server echoes, the deadline it sees,
  # a rich error detail grpc-go's own runtime decodes, and a 160 KB message that needs a
  # window update.
  grpc-go-client-interop:
    name: real gRPC interop (grpc-go client)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: build the greeter server and the grpc-go client
        run: |
          moon build --target native
          cd scripts/interop
          go build -o bin/ ./...
          cd ../..

      - name: a CA and a certificate for it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tls"
          cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout ca-key.pem -out ca.pem -days 2 -nodes -subj "/CN=moonrpc test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out server.csr -nodes -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
            -out cert.pem -days 2 -extfile ext.cnf

      - name: grpc-go client, plaintext then gzip then TLS
        run: |
          set -euo pipefail
          SERVER=./_build/native/debug/build/cmd/greetd/greetd.exe
          TLS="$RUNNER_TEMP/tls"
          echo "== plaintext =="
          "$SERVER" 12000 & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/12000) 2>/dev/null; then exec 3>&-; break; fi
            sleep 1
          done
          # The Apache peer also checks what a call carries beside its messages: the metadata
          # the server echoed, the deadline it saw, the rich error detail, and a message that
          # needs a window update. Its exit status is the assertion; these greps name them.
          ./scripts/interop/bin/client -addr 127.0.0.1:12000 | tee /tmp/go-client.txt
          grep -q 'SayHello echoes x-test' /tmp/go-client.txt
          grep -q 'SayHello saw a deadline' /tmp/go-client.txt
          grep -q 'the detail is the message the server sent' /tmp/go-client.txt
          grep -q 'BatchEcho returns every value' /tmp/go-client.txt
          echo "== gzip =="
          ./scripts/interop/bin/client -addr 127.0.0.1:12000 -gzip
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          trap - EXIT
          echo "== TLS =="
          "$SERVER" 12001 "$TLS/cert.pem" "$TLS/key.pem" & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/12001) 2>/dev/null; then exec 3>&-; break; fi
            sleep 1
          done
          ./scripts/interop/bin/client -addr 127.0.0.1:12001 -ca "$TLS/ca.pem"
          echo "grpc-go client interop OK"

  # The other direction: a real grpc-go server, and the moonrpc generated client
  # (`greetd check`) against it, plaintext and TLS. Both answers must match byte for byte,
  # which is what `client and channel agree` asserts, and the same four non-message parts of
  # a call are read back here with this library's decoder rather than grpc-go's.
  grpc-go-server-interop:
    name: real gRPC interop (grpc-go server)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: build the greeter client and the grpc-go server
        run: |
          moon build --target native
          cd scripts/interop
          go build -o bin/ ./...
          cd ../..

      - name: a CA and a certificate for it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tls"
          cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout ca-key.pem -out ca.pem -days 2 -nodes -subj "/CN=moonrpc test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout key.pem -out server.csr -nodes -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
            -out cert.pem -days 2 -extfile ext.cnf

      - name: the moonrpc generated client against the grpc-go server
        run: |
          set -euo pipefail
          CLIENT=./_build/native/debug/build/cmd/greetd/greetd.exe
          TLS="$RUNNER_TEMP/tls"
          echo "== plaintext =="
          ./scripts/interop/bin/server -addr 127.0.0.1:12002 & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/12002) 2>/dev/null; then exec 3>&-; break; fi
            sleep 1
          done
          "$CLIENT" check 12002 | tee /tmp/go-check.txt
          grep -q 'client and channel agree' /tmp/go-check.txt
          # This side reads the same four things back: the echoed metadata, the deadline it
          # set, the detail grpc-go packed, and the batch that needed a window update.
          grep -q 'SayHello echo  x-test-a=1,x-test-b=2' /tmp/go-check.txt
          grep -q '^deadline [0-9]' /tmp/go-check.txt
          grep -q 'SayHello detail  type.googleapis.com/google.protobuf.StringValue' /tmp/go-check.txt
          grep -q 'BatchEcho size  40000' /tmp/go-check.txt
          echo "== gzip =="
          # The other compression direction: this client compresses every request and
          # advertises gzip back, so a server that cannot decode a compressed message, or one
          # that answers identity, shows up here.
          "$CLIENT" check 12002 gzip | tee /tmp/go-check-gzip.txt
          grep -q 'BatchEcho size  40000' /tmp/go-check-gzip.txt
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          trap - EXIT
          echo "== TLS =="
          ./scripts/interop/bin/server -addr 127.0.0.1:12003 \
            -cert "$TLS/cert.pem" -key "$TLS/key.pem" & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/12003) 2>/dev/null; then exec 3>&-; break; fi
            sleep 1
          done
          "$CLIENT" check 12003 "$TLS/ca.pem" | tee /tmp/go-tls-check.txt
          grep -q 'client and channel agree' /tmp/go-tls-check.txt
          grep -q 'BatchEcho size  40000' /tmp/go-tls-check.txt
          echo "grpc-go server interop OK"

  # The canonical grpc.channelz.v1.Channelz service, through Server Reflection and a
  # real grpcurl client. This proves the descriptor (the refs' odd field numbers, the
  # three oneofs, the well-known imports) and the seven RPCs, not just that the bytes
  # are self-consistent.
  channelz-interop:
    name: channelz over grpcurl
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: install grpcurl
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

      - name: build channelzd
        run: moon build --target native

      - name: grpcurl list, describe and call channelz
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./_build/native/debug/build/cmd/channelzd/channelzd.exe 12010 & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if grpcurl -plaintext -max-time 2 127.0.0.1:12010 list >/dev/null 2>&1; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          G="grpcurl -plaintext -max-time 10"
          echo "== list =="
          $G 127.0.0.1:12010 list | tee /tmp/cz-list.txt
          grep -q '^grpc.channelz.v1.Channelz$' /tmp/cz-list.txt
          echo "== describe service =="
          $G 127.0.0.1:12010 describe grpc.channelz.v1.Channelz | tee /tmp/cz-svc.txt
          grep -q 'rpc GetTopChannels' /tmp/cz-svc.txt
          grep -q 'rpc GetServerSockets' /tmp/cz-svc.txt
          echo "== describe a oneof =="
          $G 127.0.0.1:12010 describe grpc.channelz.v1.Address | tee /tmp/cz-addr.txt
          grep -q 'oneof address' /tmp/cz-addr.txt
          echo "== servers =="
          $G -d '{}' 127.0.0.1:12010 grpc.channelz.v1.Channelz/GetServers | tee /tmp/cz-servers.txt
          grep -q '"server_id": "1"' /tmp/cz-servers.txt
          grep -q '"calls_started"' /tmp/cz-servers.txt
          echo "== server sockets =="
          $G -d '{"serverId":"1"}' 127.0.0.1:12010 grpc.channelz.v1.Channelz/GetServerSockets | tee /tmp/cz-sockets.txt
          grep -q '"socket_id": "2"' /tmp/cz-sockets.txt
          echo "== socket =="
          $G -d '{"socketId":"2","summary":true}' 127.0.0.1:12010 grpc.channelz.v1.Channelz/GetSocket | tee /tmp/cz-socket.txt
          grep -q '"tcpip_address"' /tmp/cz-socket.txt
          grep -q '"port": 12010' /tmp/cz-socket.txt
          echo "== top channels =="
          $G -d '{}' 127.0.0.1:12010 grpc.channelz.v1.Channelz/GetTopChannels | tee /tmp/cz-top.txt
          grep -q '"end": true' /tmp/cz-top.txt
          echo "== a missing channel is NOT_FOUND =="
          set +e
          $G -d '{"channelId":"1"}' 127.0.0.1:12010 grpc.channelz.v1.Channelz/GetChannel 2>/tmp/cz-err.txt
          set -e
          grep -q 'NotFound' /tmp/cz-err.txt
          echo "channelz interop OK"

  # Apache Thrift in both directions, over every transport and protocol this stack serves: a
  # real Thrift Go peer calls `thriftd`, and the moonrpc client (`thriftd check`) calls a real
  # Thrift Go server. TFramedTransport and Apache's header transport, TBinaryProtocol and
  # TCompactProtocol inside either, the zlib transform the header transport can carry, strict
  # message headers, exceptions, and a ONEWAY method that must leave no reply behind.
  thrift-interop:
    name: Apache Thrift interop (both directions)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: build the Thrift server and the Go peers
        run: |
          moon build --target native
          cd scripts/interop
          go build -o bin/ ./...
          cd ../..

      - name: Apache Thrift, both directions, every transport and protocol
        run: |
          set -euo pipefail
          THRIFTD=./_build/native/debug/build/cmd/thriftd/thriftd.exe
          wait_for() {
            for i in $(seq 1 30); do
              if (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null; then exec 3>&-; return 0; fi
              sleep 1
            done
            echo "nothing listening on $1" >&2
            return 1
          }
          # $1 transport, $2 protocol, $3 port for the moonrpc server, $4 port for the Go
          # server, $5 extra words for `thriftd check` (empty, or `zlib`).
          run_matrix() {
            label="$1/$2${5:+/$5}"
            tag="$1-$2${5:+-$5}"
            echo "== $label: Go client -> moonrpc server =="
            "$THRIFTD" "$3" "$1" "$2" & SRV=$!
            trap 'kill $SRV 2>/dev/null || true' EXIT
            wait_for "$3"
            # The Apache peer reads the header transport, its inner protocol, the zlib
            # transform, and that a ONEWAY call leaves nothing in front of the next reply.
            ./scripts/interop/bin/thriftclient -addr 127.0.0.1:"$3" \
              -transport "$1" -protocol "$2" ${5:+-zlib} \
              | tee "/tmp/thrift-go-client-$tag.txt"
            grep -q 'apache thrift client interop OK' "/tmp/thrift-go-client-$tag.txt"
            grep -q 'double returns 3' "/tmp/thrift-go-client-$tag.txt"
            grep -q 'an exception arrives in field 1' "/tmp/thrift-go-client-$tag.txt"
            grep -q 'a oneway call arrives' "/tmp/thrift-go-client-$tag.txt"
            kill $SRV 2>/dev/null || true
            wait $SRV 2>/dev/null || true
            trap - EXIT

            echo "== $label: moonrpc client -> Go server =="
            ./scripts/interop/bin/thriftserver -addr 127.0.0.1:"$4" \
              -transport "$1" -protocol "$2" & SRV=$!
            trap 'kill $SRV 2>/dev/null || true' EXIT
            wait_for "$4"
            "$THRIFTD" check "$4" "$1" "$2" $5 \
              | tee "/tmp/thrift-moonbit-client-$tag.txt"
            grep -q 'pong:moonrpc' "/tmp/thrift-moonbit-client-$tag.txt"
            grep -q 'add   42' "/tmp/thrift-moonbit-client-$tag.txt"
            grep -q 'double 3' "/tmp/thrift-moonbit-client-$tag.txt"
            grep -q 'boom:no' "/tmp/thrift-moonbit-client-$tag.txt"
            grep -q 'note  moonrpc' "/tmp/thrift-moonbit-client-$tag.txt"
            kill $SRV 2>/dev/null || true
            wait $SRV 2>/dev/null || true
            trap - EXIT
          }
          # Every transport this stack serves, with every protocol it serves inside it, plus
          # the zlib transform the header transport can carry. The same service answers all
          # of them, which is what makes the abstraction worth having.
          run_matrix framed binary 9090 9091 ''
          run_matrix framed compact 9092 9093 ''
          run_matrix header binary 9094 9095 ''
          run_matrix header compact 9096 9097 ''
          run_matrix header binary 9098 9099 'zlib'
          run_matrix header compact 9100 9101 'zlib'
          echo "Apache Thrift interop OK"

  # Apache Thrift's own cross test, in both directions and both protocols: their Go client
  # (`test/go/src/bin/testclient`) calls the service this stack serves, and the client here
  # calls their Go server (`testserver`), checking every answer their client checks. The
  # peers are built from the pinned tag with the bindings the Thrift compiler on the runner
  # generates, so the bytes are a reference implementation's, not this repository's.
  thrift-cross-test:
    name: Apache Thrift cross test (both directions)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: install the Thrift compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq thrift-compiler
          thrift --version

      - name: build the reference peers
        run: bash scripts/interop/build_thrift_peers.sh "$RUNNER_TEMP/athrift"

      - name: build this stack's two halves
        run: moon build --target native

      - name: Apache Thrift cross test
        run: |
          bash scripts/interop/thrift_cross_test.sh "$RUNNER_TEMP/athrift" \
            ./_build/native/debug/build/cmd/thriftcrosstest/thriftcrosstest.exe

  # The official Connect suite, driving the reference service in `src/conformance` as a server
  # under test. What it exercises is `scripts/conformance/connect.yaml`: Connect over both HTTP
  # versions, both codecs, identity and gzip.
  connect-conformance:
    name: Connect conformance (server)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build the server under test
        run: moon build --target native src/cmd/conformance

      - name: fetch the runner, at a pinned version
        env:
          VERSION: v1.0.4
        run: |
          url="https://github.com/connectrpc/conformance/releases/download/${VERSION}/connectconformance-${VERSION}-Linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/runner.tar.gz" "$url"
          tar xzf "$RUNNER_TEMP/runner.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/connectconformance" --version

      # Gating: the suite is the criterion, so a regression here fails the build the way a test
      # does. Every case it runs is declared in `scripts/conformance/connect.yaml`.
      - name: run the suite
        run: |
          "$RUNNER_TEMP/connectconformance" \
            --mode server \
            --conf scripts/conformance/connect.yaml \
            -- ./_build/native/debug/build/cmd/conformance/conformance.exe
